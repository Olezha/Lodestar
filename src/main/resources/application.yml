spring:
  application:
    name: lodestar

  datasource:
    url: jdbc:postgresql://localhost:5433/lodestar_db
    username: postgres
    password: postgres_password
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: lodestar-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.olehshklyar.lodestar.dto.AlertEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    cache:
      channel:
        size: 25 # Channel pool size (number of reusable channels per connection)
        checkout-timeout: 5000ms # Max wait time to borrow a pooled channel (default: 0; enforces pool size as a hard limit)
      connection:
        mode: channel # Multiplex channels over a single TCP connection (use 'connection' to pool TCP sockets)
    listener:
      simple:
        concurrency: 2 # Minimum/initial number of concurrent consumer threads (and dedicated AMQP channels)
        max-concurrency: 5 # Maximum consumer threads; dynamically scales up during alert traffic spikes
        prefetch: 10 # AMQP basic.qos limit per consumer channel to ensure fair dispatch and prevent buffer bloat
        default-requeue-rejected: false # Route exhausted/failed messages to DLX (requeue=false) instead of poison-pill looping
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms

lodestar:
  viber:
    api-url: https://chatapi.viber.com/pa/send_message
    auth-token: ${VIBER_AUTH_TOKEN:dummy-token}
    sender-name: Lodestar Alerts
    dry-run: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
