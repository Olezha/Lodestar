spring:
  application:
    name: lodestar

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lodestar_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: lodestar-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.olehshklyar.lodestar.dto.AlertEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    cache:
      channel:
        size: 25 # Channel pool size (number of reusable channels per connection)
        checkout-timeout: 5000ms # Max wait time to borrow a pooled channel (default: 0; enforces pool size as a hard limit)
      connection:
        mode: channel # Multiplex channels over a single TCP connection (use 'connection' to pool TCP sockets)
    listener:
      simple:
        concurrency: 2 # Minimum/initial number of concurrent consumer threads (and dedicated AMQP channels)
        max-concurrency: 5 # Maximum consumer threads; dynamically scales up during alert traffic spikes
        prefetch: 10 # AMQP basic.qos limit per consumer channel to ensure fair dispatch and prevent buffer bloat
        default-requeue-rejected: false # Route exhausted/failed messages to DLX (requeue=false) instead of poison-pill looping
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms

lodestar:
  viber:
    api-url: ${VIBER_API_URL:https://chatapi.viber.com/pa/send_message}
    auth-token: ${VIBER_AUTH_TOKEN:dummy-token}
    sender-name: ${VIBER_SENDER_NAME:Lodestar Alerts}
    dry-run: ${VIBER_DRY_RUN:true}
  discord:
    default-webhook-url: ${DISCORD_WEBHOOK_URL:}
    username: ${DISCORD_USERNAME:Lodestar Alerts}
    dry-run: ${DISCORD_DRY_RUN:true}
  ntfy:
    server-url: ${NTFY_SERVER_URL:https://ntfy.sh}
    default-topic: ${NTFY_DEFAULT_TOPIC:lodestar-alerts}
    dry-run: ${NTFY_DRY_RUN:true}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.data.repository.config: WARN
